# 行カバレッジ 100% の登録簿 (ippoan/alc-lineworks-worker・ohishi-exp/rust-leave-worker の同名のファイルの形。
# Refs ippoan/rust-alc-api#747)。
#
#   bash scripts/fetch-migrations.sh
#   NOTIFY_TEST_ADMIN_DATABASE_URL=... cargo llvm-cov --locked -p notify --text > cov-notify.txt
#   bash scripts/check_coverage_100.sh --use-cache cov-notify.txt
#
# 計測するのは `cargo test -p notify` の全部 = 単体テストと tests/recipients_db.rs・tests/lineworks_db.rs・tests/distribute_db.rs・tests/inbound_db.rs (口から実 DB まで。接続先が無ければ失敗する。
# lineworks-worker・LINE・viewer はモック)。
# worker 本体 (直下の src/、wasm 専用) は native で計測できないので対象外。

# tenant の layer と DB の失敗の応答・ログ
[[files]]
path = "crates/notify/src/lib.rs"

# SQL を流す 1 か所 (tests/recipients_db.rs が実 DB で通す)
[[files]]
path = "crates/notify/src/pg.rs"

# 宛先の口 (CRUD と bulk)
[[files]]
path = "crates/notify/src/recipients.rs"

# グループの口 (CRUD とメンバー)
[[files]]
path = "crates/notify/src/groups.rs"

# LINE の設定の口 (暗号化して保存)
[[files]]
path = "crates/notify/src/line_config.rs"

# LINE WORKS のトークルームの口 (一覧・削除・試し送信。lineworks-worker はモック)
[[files]]
path = "crates/notify/src/channels.rs"

# LINE WORKS の users・login-activity と lineworks-worker の呼び出し・断りの写し
[[files]]
path = "crates/notify/src/lineworks.rs"

# 配信の口 (distribute・test-distribute。LINE・lineworks-worker・viewer はモック)
[[files]]
path = "crates/notify/src/distribute.rs"

# LINE の Messaging API (JWT・token の cache・push。外への POST はモック)
[[files]]
path = "crates/notify/src/line.rs"

# viewer の KV への登録 (register-view)
[[files]]
path = "crates/notify/src/viewer_register.rs"

# 外への POST の口 (trait と応答)
[[files]]
path = "crates/notify/src/http.rs"

# Cloudflare Email Routing の送り先 (宛先のメールアドレスの登録と確認の状態。API はモック)
[[files]]
path = "crates/notify/src/email_routing.rs"

# LINE の webhook の受け口 (署名の照合・follow で宛先を作る。tests/inbound_db.rs が実 DB で通す。LINE はモック)
[[files]]
path = "crates/notify/src/line_webhook.rs"

# LINE WORKS の webhook の受け口 (bot-secret・event。tests/inbound_db.rs が実 DB で通す)
[[files]]
path = "crates/notify/src/lineworks_webhook.rs"
