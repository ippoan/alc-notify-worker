# notify の配信・宛先の Worker (Refs ippoan/rust-alc-api#747)。
# 型は ippoan/alc-lineworks-worker と同じ。
#
# ★ この Worker は呼び手を認証しない (auth-worker が付けた X-Tenant-ID を信頼する)。
#   本番・staging とも、到達経路は auth-worker からの Service Binding だけにする:
#   - workers_dev = false / preview_urls = false (*.workers.dev と preview URL を開けない)
#   - route / routes / custom_domain を書かない
#   どの env も workers_dev / preview_urls を false にする (ohishi-exp/rust-leave-worker#3 の決定と同じ)。
#   scripts/check-exposure.sh が CI で毎回これを検査する。
# ★ 表の順を変えない・前の方に表を足さない (scripts/check-exposure-test.sh の陰性対照は、特定の表の
#   直前に行を挿して崩す作り。CLAUDE.md)。新しい表は placement の表より後に置く。
name = "alc-notify"
main = "build/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[build]
command = "cargo install -q worker-build@0.8.7 && worker-build --release"

# 応答ヘッダー x-worker-version / x-worker-tag の元 (src/lib.rs)。binding は env に継承されないので
# トップレベルと env.staging の両方に要る。tag / message は deploy の --tag / --message (deploy.yml)
[version_metadata]
binding = "CF_VERSION_METADATA"

# 本番の DB は aws:ap-northeast-1。Worker をその近くで動かす
[placement]
region = "aws:ap-northeast-1"

# 本番でもログを残す (env に継承されないので、staging は下で別に書く)。口が出すログは段の名前・kind だけ
[observability]
enabled = true

# 本番の DB: Cloudflare Hyperdrive の binding NOTIFY_HYPERDRIVE (src/db.rs)。設定は実行用ロールのもの 1 つを
# 複数の worker で共有する (worker ごとに作らない。id は ippoan/alc-lineworks-worker・ippoan/alc-vein-worker と同じ)。
# 接続先・資格情報・TLS は設定の側に在り、ここに書くのは設定の ID だけ。
# env.staging / env.local には置かない (binding は env に継承されない。scripts/check-exposure.sh が検査する)。
[[hyperdrive]]
binding = "NOTIFY_HYPERDRIVE"
id = "6bdf446634034f989d4e094d5510b162"

# line-config の channel_secret / private_key の暗号化の鍵 (ippoan/alc-lineworks-worker・auth-worker と同じ Secrets Store の
# secret。値は repo に無い)。binding は env に継承されないので staging にも書く
[[secrets_store_secrets]]
binding = "SSO_ENCRYPTION_KEY"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "sso-encryption-key"

# LINE WORKS の API は ippoan/alc-lineworks-worker を Service Binding で呼ぶ (src/lineworks.rs)。staging は下で別に書く
[[services]]
binding = "ALC_LINEWORKS"
service = "alc-lineworks"

# 配信のときに viewer の Worker (ippoan/nuxt-notify) の KV へ view を登録する口の認証 (nuxt-notify・auth-worker と同じ
# Secrets Store の secret。値は repo に無い)。配信の口でだけ引く (src/lib.rs)。binding は env に継承されないので staging にも書く
[[secrets_store_secrets]]
binding = "INTERNAL_SHARED_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

# 宛先のメールアドレスを Cloudflare Email Routing の送り先として登録する API の token (Email Routing Addresses Edit)
# (src/email_routing.rs。宛先の保存と GET /api/notify/recipients/email-status でだけ引く。値は repo に無い。account ID は [vars])。
# 無い・読めないときは Cloudflare を呼ばない。binding は env に継承されないので staging にも書く
[[secrets_store_secrets]]
binding = "CF_EMAIL_ROUTING_TOKEN"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "cf-email-routing-token"

# 配信のメッセージに載せる viewer のページ・画像の URL と、register-view の宛先 (rust-alc-api の cloudrun/render.sh の
# NOTIFY_FRONTEND_URL と同じ値)。利用者に配る公開の URL なので平文で書く (ippoan/nuxt-notify の wrangler.jsonc にも在る)。
# vars は env に継承されないので staging は下で別に書く
[vars]
NOTIFY_FRONTEND_URL = "https://notify.ippoan.org"
# account ID は他の Worker と同じく平文 (ユーザー決定 2026-10-19、Refs ippoan/alc-app#436)。Email Routing の API の宛先 (src/email_routing.rs)
CF_ACCOUNT_ID = "24b45709d060d957340180e995f0d373"

# 本番の R2 (文書のファイルの置き場。rust-alc-api の NOTIFY_R2_BUCKET と同じ bucket で、既存のファイルをそのまま読む。
# 閲覧の口 (preview・download) が読むだけ)。binding は env に継承されないので、staging は下で別の bucket を指す
[[r2_buckets]]
binding = "NOTIFY_R2"
bucket_name = "notify-files"

# 抽出・黒塗りの背景処理 (W8c-2。crates/notify/src/background.rs)。producer は recompute・upload・ingest の口と、
# 一時的な失敗の送り直し。consumer は同じ worker の #[event(queue)] (src/lib.rs)。1 メッセージずつ (PDF は 25 MiB まで・
# Gemini の呼び出しは数十秒かかる)。送り直しは本文の attempt で数えるので、Queues の retry は requeue に失敗したときだけ。
# queue は env に継承されないので staging は下で別の queue を書く (scripts/check-exposure.sh が本番の queue を指さないことを検査)
[[queues.producers]]
binding = "NOTIFY_DOCS_QUEUE"
queue = "notify-docs"

[[queues.consumers]]
queue = "notify-docs"
max_batch_size = 1
max_retries = 3

# alc-redact (GCP Cloud Run) の黒塗りと抽出: auth-worker の named entrypoint AlcRedactEntrypoint の RPC (src/redact.rs)。
# ID token を作る SA の鍵は auth-worker の 1 か所 (この worker に配らない)。staging は auth-worker-staging
[[services]]
binding = "ALC_REDACT"
service = "auth-worker"
entrypoint = "AlcRedactEntrypoint"

# 黒塗りの終わりの WS の push (src/bus.rs): nuxt-notify の notify-realtime-bus の POST /broadcast。staging は -staging
[[services]]
binding = "NOTIFY_REALTIME_BUS"
service = "notify-realtime-bus"

# realtime-bus の /broadcast の X-Broadcast-Secret (realtime-bus と同じ Secrets Store の secret。値は repo に無い)。
# consumer でだけ引く。staging は staging の secret (realtime-bus の staging と同じ)
[[secrets_store_secrets]]
binding = "NOTIFY_REDACT_BROADCAST_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "notify-redact-broadcast-secret"

# staging: DB は ippoan/alc-vein-worker の staging と同じもの (Workers VPC の binding NOTIFY_DB_VPC から
# 既存の Tunnel 経由で PgBouncer へ繋ぐ。src/db.rs)。Hyperdrive は通さない。
[env.staging]
name = "alc-notify-staging"
workers_dev = false
preview_urls = false

[env.staging.observability]
enabled = true

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

# Worker の実行場所を staging の DB の近くに寄せる (ippoan/alc-vein-worker の staging と同じ region)
[env.staging.placement]
region = "aws:ap-northeast-3"

# staging の DB への口 (vein・lineworks の staging と同じ VPC Service を共有)。本番 (トップレベル) には置かない
# (scripts/check-exposure.sh が検査)
[[env.staging.vpc_services]]
binding = "NOTIFY_DB_VPC"
# service_id は VPC Service の参照 (宛先の Tunnel・host:port は Service 側に閉じる)
service_id = "01a0efa3-57ee-7631-912e-7f261d828127"
remote = true

[[env.staging.secrets_store_secrets]]
binding = "SSO_ENCRYPTION_KEY"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "sso-encryption-key"

[[env.staging.services]]
binding = "ALC_LINEWORKS"
service = "alc-lineworks-staging"

[[env.staging.secrets_store_secrets]]
binding = "INTERNAL_SHARED_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

[[env.staging.secrets_store_secrets]]
binding = "CF_EMAIL_ROUTING_TOKEN"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "cf-email-routing-token"

# staging の R2 は staging 用の bucket (rust-alc-api の staging と同じ。本番の bucket を指すと本番のファイルを読む。
# scripts/check-exposure.sh が検査)
[[env.staging.r2_buckets]]
binding = "NOTIFY_R2"
bucket_name = "notify-files-staging"

[[env.staging.queues.producers]]
binding = "NOTIFY_DOCS_QUEUE"
queue = "notify-docs-staging"

[[env.staging.queues.consumers]]
queue = "notify-docs-staging"
max_batch_size = 1
max_retries = 3

[[env.staging.services]]
binding = "ALC_REDACT"
service = "auth-worker-staging"
entrypoint = "AlcRedactEntrypoint"

[[env.staging.services]]
binding = "NOTIFY_REALTIME_BUS"
service = "notify-realtime-bus-staging"

[[env.staging.secrets_store_secrets]]
binding = "NOTIFY_REDACT_BROADCAST_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "notify-redact-broadcast-secret-staging"

[env.staging.vars]
NOTIFY_FRONTEND_URL = "https://notify-staging.ippoan.org"
# account ID は他の Worker と同じく平文 (ユーザー決定 2026-10-19、Refs ippoan/alc-app#436)。Email Routing の API の宛先 (src/email_routing.rs)
CF_ACCOUNT_ID = "24b45709d060d957340180e995f0d373"

# ローカル (`wrangler dev --env local`) 専用。deploy しない。
# binding を持たない (binding は env に継承されない) ので、src/db.rs は文字列 DATABASE_URL の段で繋ぐ
[env.local]
name = "alc-notify-local"
workers_dev = false
preview_urls = false
